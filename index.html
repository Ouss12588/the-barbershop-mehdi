<title>The Barbershop Mehdi</title>
<style>

body{

.card{
  width:100%; max-width:420px; text-align:center; padding:34px 22px;
  border-radius:24px; background:#171717;
  box-shadow:0 18px 50px rgba(0,0,0,.35);

.logo{
  width:90px;height:90px;border-radius:50%;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;
  background:#fff;color:#111;font-size:34px;font-weight:800;
}
h1{margin:0 0 8px;font-size:25px}
p{margin:0 0 26px;color:#bbb;font-size:15px}
a{
  display:block; text-decoration:none; color:#111; background:#fff;
  margin:12px 0; padding:16px; border-radius:14px;
  font-weight:700; font-size:16px; transition:.2s;
}
a:hover{transform:translateY(-2px);background:#eee}
.footer{margin-top:24px;color:#777;font-size:12px}

</head>
